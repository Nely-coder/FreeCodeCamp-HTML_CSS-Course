<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tribute Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main id="main">
      <h1 id="title">A Telling Of Dr. Kwame Nkrumah</h1>
      <p>The first president of Ghana.</p>
      <figure id="img-div">
        <img
          id="image"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzbjrqMrPIle3nnvVqPvBSLVt9fqio0c_GHNDIIcrP8Nx9pVIWdbH7IBCzj9kHVAwTE9b_fRo-3vZErlmiZ6w1kFHs1CH2g6LPJNqQWA&s=10"
          alt="a b/w pic of Kwame Nkrumah"
        />

        <figcaption id="img-caption">
          An old photograph of Kwame Nkrumah in Kente.
        </figcaption>

        <div id="tribute-info">
          <p>
            Kwame Kofi Nkrumah, baptised Francis, was a Ghanaian politician,
            political theorist, and revolutionary. He served as Prime Minister
            of the Gold Coast from 1952 until 1957, when it gained independence
            from the United Kingdom. He was then the first prime minister and
            then the president of Ghana, from 1957 until 1966.
          </p>
          <a
            id="tribute-link"
            href="https://en.wikipedia.org/wiki/Kwame_Nkrumah"
            target="_blank"
            >Learn More From Wikipedia</a
          >
        </div>
      </figure>
    </main>
  </body>
